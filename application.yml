spring:

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flexchain}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

flexchain:
  capital:
    budget: 5000
  orchestrator:
    enabled-by-default: true
    interval-ms: 12000
    probability: 0.5